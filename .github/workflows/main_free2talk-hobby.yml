# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - free2talk-hobby

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          
      - name: Install pnpm
        run: npm install -g pnpm@9.15
      
      - name: Install and build backend (apps/api)
        run: |
          pnpm install
          pnpm build:api
          
      # Create a self-contained runtime folder for the API
      - name: Prepare API runtime folder
        run: |
          mkdir -p output/api-runtime
          # copy built API
          cp -R apps/api/dist output/api-runtime/dist
          # copy API package.json (so npm knows how to run it)
          cp apps/api/package.json output/api-runtime/package.json
          # install production deps for the API only
          cd output/api-runtime
          npm install --only=production

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: output/api-runtime
      

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E073B6A5512E451E911CAE8353EC8020 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CA444E5D87344BD9A41255B33C1C19E0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_94AACAAFBA87490BA97A50C5FCAED6B4 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'free2talk-hobby'
          slot-name: 'Production'
          package: .
          
